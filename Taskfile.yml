# Nigiri Studio: local entry points. https://taskfile.dev
#
#   task setup     first time: install dependencies
#   task dev       run the dev server
#   task check     type-check, lint and unit tests, the same as CI
version: "3"

tasks:
  default:
    cmds:
      - task --list

  setup:
    desc: Install dependencies.
    cmds:
      - npm install

  dev:
    desc: Dev server with reload (http://localhost:5173).
    cmds:
      - npm run dev

  build:
    desc: Type-check and build to dist/.
    cmds:
      - npm run build

  preview:
    desc: Serve the production build.
    deps: [build]
    cmds:
      - npm run preview

  # ---- checks -------------------------------------------------------------

  typecheck:
    desc: Type-check the app.
    cmds:
      - npm run typecheck

  lint:
    desc: Lint with oxlint.
    cmds:
      - npm run lint

  test:
    desc: Unit and component tests.
    cmds:
      - npm test

  test:watch:
    desc: Tests in watch mode.
    cmds:
      - npm run test:watch

  check:
    desc: "What CI runs: type-check, lint, then tests."
    cmds:
      - task: typecheck
      - task: lint
      - task: test

  # ---- housekeeping -------------------------------------------------------

  deploy:
    desc: Trigger the GitHub Pages workflow.
    cmds:
      - gh workflow run deploy.yml

  clean:
    desc: Remove build output and caches.
    cmds:
      - rm -rf dist node_modules/.vite
